# ============================================================
# APPLICATION
# ============================================================
spring.application.name=Alpha Flow
spring.application.version=0.1.0
# ============================================================
# DATABASE
# ============================================================
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
# ============================================================
# ACTUATOR / MONITORING
# ============================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
# ============================================================
# LOGGING
# ============================================================
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.alphaflow=INFO
# ============================================================
# ERROR HANDLING
# ============================================================
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
# ============================================================
# ALPHA FLOW CONFIG
# ============================================================
alphaflow.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
alphaflow.yahoo.download-url=https://query1.finance.yahoo.com/v8/finance/chart/{symbol}?period1={start}&period2={end}&interval=1d
alphaflow.yahoo.delay-milliseconds=1000
alphaflow.yahoo.market-timezone=America/New_York
alphaflow.yahoo.market-cutoff-time=17:00
alphaflow.yahoo.holidays=2026-01-01,2026-01-19,2026-02-16,2026-04-03,2026-05-25,2026-06-19,2026-07-03,2026-09-07,2026-11-26,2026-12-25
alphaflow.angelone.api-key=${ANGEL_ONE_API_KEY:}
alphaflow.angelone.client-code=${ANGEL_ONE_CLIENT_CODE:}
alphaflow.angelone.password=${ANGEL_ONE_PASSWORD:}
alphaflow.angelone.totp-key=${ANGEL_ONE_TOTP_KEY:}
alphaflow.angelone.login-url=https://apiconnect.angelone.in/rest/auth/angelbroking/user/v1/loginByPassword
alphaflow.angelone.candle-url=https://apiconnect.angelone.in/rest/secure/angelbroking/historical/v1/getCandleData
alphaflow.angelone.quote-url=https://apiconnect.angelone.in/rest/secure/angelbroking/market/v1/quote
alphaflow.angelone.delay-milliseconds=1000
alphaflow.angelone.initial-lookback-days=5
alphaflow.angelone.token-ttl-seconds=72000
