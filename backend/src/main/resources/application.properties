# ============================================================
# APPLICATION
# ============================================================
spring.application.name=Alpha Flow
spring.application.version=0.1.0
# ============================================================
# ALPHA FLOW CONFIG
# ============================================================
alphaflow.yahoo.download-url=https://query1.finance.yahoo.com/v8/finance/chart/{symbol}?period1={start}&period2={end}&interval=1d
alphaflow.yahoo.delay-milliseconds=1000
alphaflow.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
# Indicator matrix configurations mapped to timeframes.
alphaflow.indicators.timeframes.daily=1,2,3,4,5,6
alphaflow.indicators.timeframes.weekly=7

# ============================================================
# DATABASE
# ============================================================
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
# ============================================================
# ACTUATOR / MONITORING
# ============================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
# ============================================================
# LOGGING
# ============================================================
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.alphaflow=INFO
# ============================================================
# ERROR HANDLING
# ============================================================
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# ============================================================
# SUPPORT/RESISTANCE CALCULATION
# ============================================================
# The number of bars before/after to confirm a local pivot high/low
alphaflow.sr.daily.window=10
alphaflow.sr.weekly.window=5
# The minimum number of aligned pivots to form a valid horizontal line
alphaflow.sr.daily.horizontal-min-touches=3
alphaflow.sr.weekly.horizontal-min-touches=2
# The minimum number of sequential pivots to draw an angular regression line
alphaflow.sr.daily.angular-min-touches=4
alphaflow.sr.weekly.angular-min-touches=4
# Max allowed times the price can break a line before it's permanently deleted
alphaflow.sr.daily.max-breaks=2
alphaflow.sr.weekly.max-breaks=4
# Deletes horizontal lines that are this % away from the current price
alphaflow.sr.daily.cb-horizontal-pct=20
alphaflow.sr.weekly.cb-horizontal-pct=50
# Deletes angular lines whose expected current price is this % away
alphaflow.sr.daily.cb-angular-pct=35
alphaflow.sr.weekly.cb-angular-pct=75
# Max % difference between a pivot and a line's average to be grouped together
alphaflow.sr.daily.tolerance-pct=1.0
alphaflow.sr.weekly.tolerance-pct=1.0
# Max % difference between two current line projections before merging them
alphaflow.sr.daily.proximity-pct=1.0
alphaflow.sr.weekly.proximity-pct=1.0
