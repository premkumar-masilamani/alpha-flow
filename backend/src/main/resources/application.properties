# ============================================================
# APPLICATION
# ============================================================
spring.application.name=Alpha Flow
spring.application.version=0.1.0

# ============================================================
# BINANCE INGESTION
# ============================================================
alphaflow.binance.download-url=https://data.binance.vision/data/spot/daily/trades/{ticker}/{filename}
alphaflow.binance.download-dir=${ALPHAFLOW_BINANCE_DOWNLOAD_DIR}

# ============================================================
# DATABASE
# ============================================================
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=none

# ============================================================
# ACTUATOR / MONITORING
# ============================================================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ============================================================
# LOGGING
# ============================================================
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.alphaflow=DEBUG

# ============================================================
# ERROR HANDLING
# ============================================================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-exception=true
