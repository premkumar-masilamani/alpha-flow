# ============================================================
# APPLICATION
# ============================================================
spring.application.name=Alpha Flow
spring.application.version=0.1.0
# ============================================================
# ALPHA FLOW CONFIG
# ============================================================
alphaflow.yahoo.download-url=https://query1.finance.yahoo.com/v8/finance/chart/{symbol}?period1={start}&period2={end}&interval=1d
alphaflow.yahoo.delay-milliseconds=1000
alphaflow.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
# How many most-recent bars the OHLCV / indicator endpoints return, per timeframe.
alphaflow.api.window=180
# Indicator matrix (computed after the daily->weekly rollup). All sources default to CLOSE.
alphaflow.indicators.timeframes.daily[0].type=EMA
alphaflow.indicators.timeframes.daily[0].params.period=5
alphaflow.indicators.timeframes.daily[1].type=EMA
alphaflow.indicators.timeframes.daily[1].params.period=13
alphaflow.indicators.timeframes.daily[2].type=EMA
alphaflow.indicators.timeframes.daily[2].params.period=26
alphaflow.indicators.timeframes.daily[3].type=RSI
alphaflow.indicators.timeframes.daily[3].params.period=14
alphaflow.indicators.timeframes.daily[3].upperBound=70
alphaflow.indicators.timeframes.daily[3].lowerBound=30
alphaflow.indicators.timeframes.daily[4].type=STOCHASTIC
alphaflow.indicators.timeframes.daily[4].params.k=14
alphaflow.indicators.timeframes.daily[4].params.kSmooth=3
alphaflow.indicators.timeframes.daily[4].params.dSmooth=3
alphaflow.indicators.timeframes.daily[4].upperBound=80
alphaflow.indicators.timeframes.daily[4].lowerBound=20
alphaflow.indicators.timeframes.daily[5].type=SMA
alphaflow.indicators.timeframes.daily[5].source=VOLUME
alphaflow.indicators.timeframes.daily[5].params.period=20
alphaflow.indicators.timeframes.weekly[0].type=MACD
alphaflow.indicators.timeframes.weekly[0].params.fast=12
alphaflow.indicators.timeframes.weekly[0].params.slow=26
alphaflow.indicators.timeframes.weekly[0].params.signal=9
# ============================================================
# DATABASE
# ============================================================
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
# ============================================================
# ACTUATOR / MONITORING
# ============================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
# ============================================================
# LOGGING
# ============================================================
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.alphaflow=INFO
# ============================================================
# ERROR HANDLING
# ============================================================
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
