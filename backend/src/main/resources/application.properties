spring.application.name=TechnicalAnalysisApplication

app.binance.download-url=https://data.binance.vision/data/spot/daily/trades/{ticker}/{filename}

# Directory where files will be downloaded
app.download-dir=/Volumes/Prem/Binance

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/ta_db
spring.datasource.username=postgres_user
spring.datasource.password=postgres_password
spring.jpa.hibernate.ddl-auto=update

# Expose all actuator endpoints
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# LOGGING
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.prem.ta=INFO
