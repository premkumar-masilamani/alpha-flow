# ============================================================
# APPLICATION
# ============================================================
spring.application.name=AlphaFlowApp
spring.application.version=0.1.0
# ============================================================
# BINANCE INGESTION
# ============================================================
app.binance.download-url=https://data.binance.vision/data/spot/daily/trades/{ticker}/{filename}
app.binance.download-dir=/Volumes/Prem/Binance
# ============================================================
# DATABASE
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/ta_db
spring.datasource.username=postgres_user
spring.datasource.password=postgres_password
# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=none
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
# ============================================================
# ACTUATOR / MONITORING
# ============================================================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
# ============================================================
# LOGGING
# ============================================================
logging.level.root=INFO
logging.level.org.springframework=INFO
#logging.level.org.hibernate.sql=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.basicbinder=DEBUG
logging.level.com.alphaflow=DEBUG
# ============================================================
# ERROR HANDLING
# ============================================================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-exception=true
