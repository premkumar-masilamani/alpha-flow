spring.application.name=TechnicalAnalysisApplication

app.binance.download-url=https://data.binance.vision/data/spot/daily/trades/{ticker}/{filename}
app.binance.download-dir=/Volumes/Prem/Binance

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/ta_db
spring.datasource.username=postgres_user
spring.datasource.password=postgres_password

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# Expose all actuator endpoints
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# LOGGING
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.prem.ta=DEBUG
